# A release is a merge of dev into master. Each push to master tags its commit `v` +
# src-tauri/tauri.conf.json's `version` (set by version.sh / version.bat), then builds the
# desktop installers on Windows (NSIS, MSI), macOS (dmg) and Linux (deb, rpm, AppImage), since
# Tauri only bundles for the OS it runs on. A version that is already tagged fails the run: set the
# next one before merging. The installers are kept as
# the run's artifacts; nothing is signed or published.

name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        run: |
          tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          if git rev-parse --quiet --verify "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag is already released; set the next version (version.sh) before merging into master."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "$tag" -m "Flotilla ${tag#v}" "$GITHUB_SHA"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  bundle:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ needs.tag.outputs.tag }}-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

# A release is a pushed tag `v<x.y.z>` on a commit of main whose src-tauri/tauri.conf.json
# `version` is x.y.z (set by version.sh / version.bat); any other tag fails the run. It builds the
# desktop installers on Windows (NSIS, MSI), macOS (dmg) and Linux (deb, rpm, AppImage), since
# Tauri only bundles for the OS it runs on. The installers are kept as the run's artifacts; nothing
# is signed or published.

name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        run: |
          tag="$GITHUB_REF_NAME"
          version="v$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "$tag" != "$version" ]; then
            echo "::error::$tag is on a commit whose tauri.conf.json says $version. Tag the commit that set the version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$tag is not on main. Tag a commit of main."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  bundle:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ needs.tag.outputs.tag }}-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

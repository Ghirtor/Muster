name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A feature branch reaches dev rebased onto it, as one merge commit. Of its own merge commits it
  # may keep only a first-time merge of another feature branch: one that merges its base in (to
  # take dev's new commits or settle conflicts) or re-syncs with a branch it already shares work
  # with (merging the same branch again, or the branch it was started from) must be a rebase.
  # gitHooks/pre-merge-commit refuses the same merges locally. The PR from dev into main is the
  # one that carries any merge. It checks the PR's head, not the merge ref checkout makes.
  linear-history:
    if: github.event_name == 'pull_request' && github.head_ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: |
          base="origin/${{ github.base_ref }}"
          for merge in $(git rev-list --merges "$base..HEAD"); do
            first=$(git rev-parse "$merge^1")
            for parent in $(git rev-list --parents -n 1 "$merge" | cut -d' ' -f3-); do
              if git merge-base --is-ancestor "$parent" "$base"; then
                reason="merges ${{ github.base_ref }} in"
              elif ! git merge-base --is-ancestor "$(git merge-base "$first" "$parent")" "$base"; then
                reason="syncs with a branch it already shares work with"
              else
                continue
              fi
              git log --oneline --no-walk "$merge"
              echo "::error::$merge $reason. Rebase instead: git rebase origin/${{ github.base_ref }}, or onto the branch it shares work with."
              exit 1
            done
          done

  # Merging into main releases the version in tauri.conf.json (release.yml), which fails once the
  # merge is done if that version is already tagged. Refusing the pull request catches a forgotten
  # version.sh while it can still be fixed on dev. Skipped on other pull requests, which counts as
  # passing for the ruleset that requires it.
  release-version:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: |
          tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag is already released. Set the next version on dev before merging: ./version.sh <x.y.z> FEAT-<n>"
            exit 1
          fi
          echo "$tag is not tagged yet; merging releases it."

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: node --run lint
      - run: node --run format:check

  type-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run type-check

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            junit.xml
            coverage/

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run build

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A feature branch reaches main rebased onto it, as one merge commit. Of its own merge commits it
  # may keep only a first-time merge of another feature branch: one that merges its base in (to
  # take main's new commits or settle conflicts) or re-syncs with a branch it already shares work
  # with (merging the same branch again, or the branch it was started from) must be a rebase.
  # gitHooks/pre-merge-commit refuses the same merges locally. It checks the PR's head, not the
  # merge ref checkout makes.
  linear-history:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: |
          base="origin/${{ github.base_ref }}"
          for merge in $(git rev-list --merges "$base..HEAD"); do
            first=$(git rev-parse "$merge^1")
            for parent in $(git rev-list --parents -n 1 "$merge" | cut -d' ' -f3-); do
              if git merge-base --is-ancestor "$parent" "$base"; then
                reason="merges ${{ github.base_ref }} in"
              elif ! git merge-base --is-ancestor "$(git merge-base "$first" "$parent")" "$base"; then
                reason="syncs with a branch it already shares work with"
              else
                continue
              fi
              git log --oneline --no-walk "$merge"
              echo "::error::$merge $reason. Rebase instead: git rebase origin/${{ github.base_ref }}, or onto the branch it shares work with."
              exit 1
            done
          done

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: node --run lint
      - run: node --run format:check

  type-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run type-check

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            junit.xml
            coverage/

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run build

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A feature branch reaches dev rebased onto it, as one merge commit, so it may carry none of its
  # own (gitHooks/pre-merge-commit refuses them locally). The PR from dev into main is the one
  # that carries merges. It checks the PR's head, not the merge ref checkout makes by default.
  linear-history:
    if: github.event_name == 'pull_request' && github.head_ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: |
          merges=$(git rev-list --merges "origin/${{ github.base_ref }}..HEAD")
          if [ -n "$merges" ]; then
            git log --oneline --no-walk $merges
            echo "::error::This branch has merge commits. Rebase it onto ${{ github.base_ref }} instead of merging: git rebase origin/${{ github.base_ref }}"
            exit 1
          fi

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: node --run lint
      - run: node --run format:check

  type-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run type-check

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            junit.xml
            coverage/

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run build

[package]
name = "muster"
version = "0.1.0"
description = "Launch, watch and hand over local app rigs"
authors = ["Ghirtor"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "~2.11", features = [] }
tauri-plugin-log = "2"
